# v.xingke888.com — seedance2.0 (frontend 8113, backend 8112)
# 与 meeaws / sd 是同一套服务，只是多绑一个域名。
# Cloudflare 代理在前(Full 非严格模式)，源站复用 sd.xingke888.com 的证书。
# 80 端口直接服务应用而非 301，避免 CF Flexible 模式下的重定向死循环。

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name v.xingke888.com;

    ssl_certificate     /etc/letsencrypt/live/sd.xingke888.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sd.xingke888.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/v.xingke888.com_access.log;
    error_log  /var/log/nginx/v.xingke888.com_error.log;

    client_max_body_size 100M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # ACME http-01 challenge (以后要签正式证书时用)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Stripe webhook —— 后台里配的回调地址就是 https://v.xingke888.com/webhooks/buy，
    # 不在 /api/ 前缀下，所以单独直连后端。验签要原始报文，不能改写 body。
    location /webhooks/ {
        proxy_pass http://127.0.0.1:8112/webhooks/;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8112/;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Backend uploads (static files)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8112/uploads/;
        proxy_read_timeout 120s;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:8113;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
