# demo1.fidelityai.net — seedance2.0 (frontend 8113, backend 8112)
# 与 meeaws / sd / v 是同一套服务，只是多绑一个域名。
# 这个域名的 DNS 直接指向源站（没走 Cloudflare），所以签的是自己的 Let's Encrypt 证书，
# 80 端口做 301 跳 https。

server {
    listen 80;
    listen [::]:80;
    server_name demo1.fidelityai.net;

    # ACME http-01 challenge（续期用，必须在 301 之前）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo1.fidelityai.net;

    ssl_certificate     /etc/letsencrypt/live/demo1.fidelityai.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo1.fidelityai.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/demo1.fidelityai.net_access.log;
    error_log  /var/log/nginx/demo1.fidelityai.net_error.log;

    client_max_body_size 100M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Stripe webhook —— 不在 /api/ 前缀下，单独直连后端。验签要原始报文，不能改写 body。
    location /webhooks/ {
        proxy_pass http://127.0.0.1:8112/webhooks/;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_request_buffering on;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8112/;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Backend uploads (static files)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8112/uploads/;
        proxy_read_timeout 120s;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:8113;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
